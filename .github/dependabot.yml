version: 2

# Grouped updates: each ecosystem opens ONE rolling PR per cycle containing
# all its version bumps, instead of one PR per dependency. Note: Dependabot
# *security* updates cannot be grouped and still open individual PRs.

updates:
  # Rust dependencies: single weekly overview PR for all cargo updates
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    # guard rail for ungroupable security PRs
    open-pull-requests-limit: 2
    groups:
      cargo-all:
        patterns:
          - "*"
    commit-message:
      prefix: "cargo"
    labels:
      - "dependencies"
    reviewers:
      - "Gunzinger"

  # Docker base images: single weekly PR (fires rarely; tags are floating)
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      docker-all:
        patterns:
          - "*"
    commit-message:
      prefix: "docker"
    labels:
      - "dependencies"

  # GitHub Actions: single weekly PR for all workflow action bumps
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      actions-all:
        patterns:
          - "*"
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
    reviewers:
      - "Gunzinger"
