name: byteshaver release pipeline
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch: {}

env:
  IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}/byteshaver
  BASE_CPU: x86-64-v3 # docker image and suffixless-binary use this as the target-cpu type
  # mingw cross variables for the vendored libjxl cmake build (jxl feature);
  # cmake-rs/cc honor the target-suffixed CC/CXX/AR variables
  WIN_CC: x86_64-w64-mingw32-gcc
  WIN_CXX: x86_64-w64-mingw32-g++
  WIN_AR: x86_64-w64-mingw32-ar

# least privilege by default (audit M-38): every job gets read-only repo
# access unless it explicitly needs more (release uploads, publishing)
permissions:
  contents: read

jobs:
  create_release:
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write        # creates the release object
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Create GitHub Release
      - name: Create GitHub Release
        id: gh_release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          name: Release ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false

  # Compute the CPU-target matrix for build_binaries.
  #
  # Always built: x86-64-v3 only (base / docker image / suffixless artifacts).
  # AVX-512-and-newer benefits come from RUNTIME DISPATCH inside the shipped
  # libraries (libjxl/highway AVX3+AVX3_ZEN4 kernels enabled via the
  # jpegxl-src patch, plus libde265/dav1d/libwebp dispatchers), and a separate
  # x86-64-v4 artifact showed no measurable win on any tested encoder
  # (docs/startup-and-cpu-variant-exploration.md §B) — so it is opt-in only.
  #
  # Opt-in: set the repository variable CPU_TARGETS_EXTRA (Settings →
  # Secrets and variables → Actions → Variables) to a comma-separated
  # list of extra targets, e.g. `x86-64-v4,znver5`, and they join the
  # matrix for the next release. Unset (default) = v3 only.
  matrix_prep:
    runs-on: ubuntu-latest
    outputs:
      cpu_targets: ${{ steps.targets.outputs.cpu_targets }}
    steps:
      - id: targets
        env:
          # env-mapped instead of direct ${{ }} shell interpolation; the
          # value feeds compiler flags below, so it is whitelist-validated
          # before use
          CPU_TARGETS_EXTRA: ${{ vars.CPU_TARGETS_EXTRA }}
        run: |
          TARGETS='"x86-64-v3"'
          if [ -n "$CPU_TARGETS_EXTRA" ]; then
            EXTRA_JSON=""
            for tok in $(printf '%s' "$CPU_TARGETS_EXTRA" | tr ',' ' '); do
              if [ -z "$tok" ]; then continue; fi
              case "$tok" in
                *[!A-Za-z0-9-]*)
                  echo "FATAL: invalid CPU_TARGETS_EXTRA token: $tok" >&2
                  exit 1
                  ;;
              esac
              EXTRA_JSON="${EXTRA_JSON:+$EXTRA_JSON,}\"$tok\""
            done
            TARGETS="$TARGETS,$EXTRA_JSON"
          fi
          echo "cpu_targets=[$TARGETS]" >> "$GITHUB_OUTPUT"

  build_binaries:
    needs: matrix_prep
    runs-on: ubuntu-latest
    permissions:
      contents: write        # uploads artifacts to the GitHub Release (tag runs)
    strategy:
      matrix:
        cpu_target: ${{ fromJSON(needs.matrix_prep.outputs.cpu_targets) }}
    name: Build binaries for ${{ matrix.cpu_target }}
    steps:
      # recursive: the patched jpegxl-src (tools/jpegxl-src) is a submodule
      # whose libjxl is its own nested submodule
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive

      # Extract version from the Git tag (strip leading 'v'); manual
      # workflow_dispatch runs fall back to a valid placeholder semver
      - name: Apply vendored-crate patches
        run: tools/patches/apply.sh

      - name: Set version from tag
        id: version
        run: |
          if [[ "$GITHUB_REF_NAME" == v* ]]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV
          else
            echo "VERSION=0.0.0-dispatch" >> $GITHUB_ENV
          fi

      - name: Set Cargo.toml version
        shell: bash
        run: |
          # Patch BOTH workspace crates (core + gui): the gui crate is
          # versioned in lockstep with byteshaver and the GUI binary displays
          # its own CARGO_PKG_VERSION (header + About panel) — missing
          # gui/Cargo.toml here is what shipped 0.0.0-git GUI releases.
          # Anchored so only the package `version` lines are touched
          # (Cargo.lock has one matching `version = "..."` line per crate).
          sed -i "s/^version = \"0\\.0\\.0-git\"/version = \"${VERSION}\"/" Cargo.toml gui/Cargo.toml Cargo.lock
          grep -n '^version' Cargo.toml gui/Cargo.toml
          grep -n -A1 '^name = "byteshaver' Cargo.lock

      # Windows cross toolchain: llvm-mingw (clang/lld/libc++, UCRT runtime)
      # for the x86_64-pc-windows-gnullvm target. UCRT ships with Windows 10+.
      # Cached on the pinned toolchain version; the cached tree already has
      # the dynamic libc++/libunwind import libs removed (self-containment).
      - name: Cache llvm-mingw toolchain
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.tools/llvm-mingw-20260922
          key: llvm-mingw-20260922-ucrt-ubuntu-22.04-x86_64

      - name: Install Windows toolchain (llvm-mingw, UCRT)
        run: |
          set -euo pipefail
          sudo apt-get install --yes --no-install-recommends nasm ninja-build meson pkg-config patch
          LLVM_MINGW_VERSION=20260922
          # checksum pins the toolchain that compiles every shipped Windows
          # binary (audit H-8); empty = unverified download (loud warning)
          LLVM_MINGW_SHA256="${LLVM_MINGW_SHA256:-bb7bb7654b33d5aa8712acb837c963b2e0c56352560c76105270a3268c665c21}"
          TC="$HOME/.tools/llvm-mingw-$LLVM_MINGW_VERSION"
          if [ ! -x "$TC/bin/x86_64-w64-mingw32-clang" ]; then
            mkdir -p "$HOME/.tools"
            curl -sL --fail -o "$HOME/.tools/llvm-mingw.tar.xz" \
              "https://github.com/mstorsjo/llvm-mingw/releases/download/$LLVM_MINGW_VERSION/llvm-mingw-$LLVM_MINGW_VERSION-ucrt-ubuntu-22.04-x86_64.tar.xz"
            if [ -n "$LLVM_MINGW_SHA256" ]; then
              echo "$LLVM_MINGW_SHA256  $HOME/.tools/llvm-mingw.tar.xz" | sha256sum -c -
            else
              echo "WARNING: llvm-mingw downloaded WITHOUT checksum verification (LLVM_MINGW_SHA256 is empty)" >&2
            fi
            tar -xJ -C "$HOME/.tools" -f "$HOME/.tools/llvm-mingw.tar.xz"
            rm -f "$HOME/.tools/llvm-mingw.tar.xz"
            rm -rf "$TC"
            mv "$HOME/.tools/llvm-mingw-$LLVM_MINGW_VERSION-ucrt-ubuntu-22.04-x86_64" "$TC"
            # self-contained exes: drop the libc++/libunwind import libs so the
            # linker picks the static archives (no libc++.dll/libunwind.dll)
            rm "$TC/x86_64-w64-mingw32/lib/libc++.dll.a" "$TC/x86_64-w64-mingw32/lib/libunwind.dll.a"
          fi
          echo "$TC/bin" >> "$GITHUB_PATH"
          echo "LLVM_MINGW_DIR=$TC" >> "$GITHUB_ENV"

      - name: Install rustup targets
        run: rustup target add x86_64-pc-windows-gnullvm

      # rust package / target cache
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      # ---------------------------------------------------------------
      # Linux (musl, static-pie) — CLI and GUI
      #
      # Built natively inside an alpine container: the vendored libjxl
      # (jxl feature) needs a C++ compiler against musl, which
      # ubuntu's musl-tools cross setup cannot provide (no musl-g++).
      # Alpine's native toolchain (gcc/g++/make/cmake) builds libjxl
      # for musl correctly (validated). dec-heif is NOT included in
      # the static artifacts (libheif has no static archives); it is
      # only shipped in the docker images (see validate_docker job).
      #
      # The GUI build disables eframe's wayland/x11 features per target:
      # alpine gets x11 only, windows gets neither (winit auto-selects
      # its windows backend; the wayland feature is not target-gated
      # and must stay off for non-linux targets).
      # ---------------------------------------------------------------
      # ---------------------------------------------------------------
      # Linux (musl, static-pie) — CLI and GUI
      #
      # Target-cpu tuning is passed via CARGO_TARGET_*_RUSTFLAGS **and**
      # the build uses an explicit --target: on a native build cargo
      # applies rustflags to the whole graph (host units included), which
      # compiles build scripts/proc macros with e.g. AVX-512 targeting
      # and SIGILLs on runners without those instructions (observed with
      # num-traits on x86-64-v4). With an explicit --target, host units
      # (build scripts, proc macros) stay at baseline codegen while the
      # final binaries receive the full target-cpu tuning (validated:
      # static-pie binary contains AVX-512 instructions, all build
      # scripts ran on a non-AVX-512 machine).
      # ---------------------------------------------------------------
      # Container build tree cache: keyed on Cargo.lock (+ per cpu_target, so
      # the differently-tuned matrix trees never clobber each other); the
      # restore-key falls back to the closest previous tree when Cargo.lock
      # changes, making the rebuild incremental. Ownership is safe both ways:
      # the cache action (runner) can read root-written world-readable files,
      # and the root container ignores permission bits on runner-owned
      # restored files. Note: a rustc version bump inside rust:1-alpine makes
      # cargo rebuild stale units inside the restored tree (correct, just
      # slower once per toolchain update).
      - name: Cache linux build tree
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: target-linux
          key: byteshaver-linux-target-${{ matrix.cpu_target }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: byteshaver-linux-target-${{ matrix.cpu_target }}-

      # Static libde265 + dav1d for the (now default) dec-heif feature.
      # Built decode-only from pinned upstream tarballs by
      # tools/libheif-static/build-decode-only.sh; cached on the recipe hash
      # so unchanged libheif dependency versions/configurations never rebuild.
      # libheif itself is compiled by libheif-sys's `embedded-libheif` feature
      # (vendored 1.23.1, plugins baked in, x265/aom absent => license-clean,
      # see docs/plans/17-static-libheif-and-jxl-avx512.md).
      - name: Cache static heif codec deps
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: heif-deps
          key: heif-deps-decodeonly-${{ hashFiles('tools/libheif-static/**') }}
          # NOTE(audit LOW): the prefix restore-key can restore a tree built
          # by an older recipe — safe because the recipe itself version-
          # stamps its artifacts (.stamp-* files carry codec versions and
          # the cross toolchain) and rebuilds on any mismatch, so a stale
          # restore only ever costs a rebuild, never stale codecs.
          restore-keys: heif-deps-decodeonly-

      - name: Build linux binaries (musl, in alpine container)
        shell: bash
        run: |
          echo "Building for CPU: ${{ matrix.cpu_target }} (alpine/musl)"
          # CARGO_TARGET_DIR keeps the container's (root-owned) build tree out
          # of `target/`: the container runs as root and would otherwise leave
          # root-owned files (e.g. .cargo-build-lock) that the subsequent
          # windows-gnu host build cannot overwrite. It also avoids sharing
          # host-unit dirs between the musl-host and gnu-host toolchains.
          docker run --rm -v "$PWD":/src -w /src \
            -e CARGO_TARGET_DIR=/src/target-linux \
            -e CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_RUSTFLAGS="-C target-cpu=${{ matrix.cpu_target }}" \
            rust:1-alpine sh -c '
              set -e
              unset RUSTFLAGS
              # binaries are shipped UNPACKED (instant startup, no AV
              # false-positive surface); an optional packed variant set
              # is produced later by the dedicated pack_binaries job.
              # build tools FIRST — bash is required by the heif-deps
              # recipe invoked below; meson/ninja/pkgconf/curl by the
              # dav1d build inside it
              apk add --no-cache nasm musl-dev gcc g++ make cmake file meson ninja pkgconf curl bash patch >/dev/null
              # static libde265 + dav1d for dec-heif (decode-only; no x265/aom).
              # The actions/cache above stores heif-deps across runs; inside
              # this container the recipe skips anything already present.
              mkdir -p /src/heif-deps
              /src/tools/libheif-static/build-decode-only.sh /src/heif-deps/dist > /dev/null
              export PKG_CONFIG_PATH=/src/heif-deps/dist/lib/pkgconfig
              # NOTE: the static-pie assertion must run before any packing.
              # CLI: full default features (opt-oxipng, exif, jxl, anim-webp, anim-apng, logs)
              cargo build --release --target x86_64-unknown-linux-musl -p byteshaver
              # GUI: static, x11-only windowing
              cargo build --release --target x86_64-unknown-linux-musl -p byteshaver-gui --no-default-features --features x11
              file target-linux/x86_64-unknown-linux-musl/release/byteshaver | grep -q "static-pie" \
                || (echo "ERROR: byteshaver is not static-pie" && exit 1)
              file target-linux/x86_64-unknown-linux-musl/release/byteshaver-gui | grep -q "static-pie" \
                || (echo "ERROR: byteshaver-gui is not static-pie" && exit 1)
            '
          mkdir -p current_release
          if [ "${{ matrix.cpu_target }}" == "${{ env.BASE_CPU }}" ]; then SUFFIX=""; else SUFFIX="-${{ matrix.cpu_target }}"; fi
          cp target-linux/x86_64-unknown-linux-musl/release/byteshaver "current_release/byteshaver-${{ env.VERSION }}${SUFFIX}"
          cp target-linux/x86_64-unknown-linux-musl/release/byteshaver-gui "current_release/byteshaver-gui-${{ env.VERSION }}${SUFFIX}"
          # license/attribution materials ship with every release
          cp THIRD-PARTY-NOTICES.md docs/dependency-licenses.md current_release/
          ( cd current_release && sha256sum "byteshaver-${{ env.VERSION }}${SUFFIX}" > "byteshaver-${{ env.VERSION }}${SUFFIX}.sha256" && \
            sha256sum "byteshaver-gui-${{ env.VERSION }}${SUFFIX}" > "byteshaver-gui-${{ env.VERSION }}${SUFFIX}.sha256" )

      # ---------------------------------------------------------------
      # Windows (gnullvm/ucrt cross from ubuntu) — CLI and GUI
      #
      # Full default features including jxl AND dec-heif: the vendored
      # libjxl cmake build and the statically embedded libheif cross-
      # compile via the target-suffixed CC/CXX/AR vars (llvm-mingw
      # clang), and the static libde265 + dav1d decode plugins come
      # from tools/libheif-static (same recipe as the musl build).
      # The GUI is built with --no-default-features (no unix windowing
      # backend features, see the linux step comment).
      # UCRT runtime: supported on Windows 10 and newer.
      # ---------------------------------------------------------------
      - name: Build static heif codec deps (windows)
        run: |
          set -euo pipefail
          HEIF_CC=x86_64-w64-mingw32-clang HEIF_CXX=x86_64-w64-mingw32-clang++ \
            HEIF_AR=llvm-ar HEIF_SYSROOT="$LLVM_MINGW_DIR/x86_64-w64-mingw32" \
            tools/libheif-static/build-decode-only-windows.sh "$PWD/heif-deps-win" 8

      - name: Build windows binaries (cross)
        shell: bash
        env:
          CARGO_TARGET_X86_64_PC_WINDOWS_GNULLVM_LINKER: x86_64-w64-mingw32-clang
          CC_x86_64_pc_windows_gnullvm: x86_64-w64-mingw32-clang
          CXX_x86_64_pc_windows_gnullvm: x86_64-w64-mingw32-clang++
          AR_x86_64_pc_windows_gnullvm: llvm-ar
          # static libde265/dav1d (+ their libheif.pc Requires.private) for
          # the embedded libheif; cross-compilation is intentional here
          PKG_CONFIG_PATH: ${{ github.workspace }}/heif-deps-win/lib/pkgconfig
          PKG_CONFIG_ALLOW_CROSS: "1"
          # static-build macros: keep libheif's de265 imports off the
          # dllimport path (plain symbols from the static archives)
          CXXFLAGS: "-DLIBDE265_STATIC_BUILD -DLIBHEIF_STATIC_BUILD"
          # target-scoped tuning: this is a genuine cross compile, so host
          # units (build scripts, proc macros) use plain RUSTFLAGS (unset =>
          # baseline codegen, safe on any runner CPU) and only the windows
          # target units receive the target-cpu flag
          CARGO_TARGET_X86_64_PC_WINDOWS_GNULLVM_RUSTFLAGS: "-C target-cpu=${{ matrix.cpu_target }}"
        run: |
          echo "Building for CPU: ${{ matrix.cpu_target }} (windows-gnullvm)"
          cargo build --release --target x86_64-pc-windows-gnullvm -p byteshaver
          cargo build --release --target x86_64-pc-windows-gnullvm -p byteshaver-gui --no-default-features
          # guard against C++ runtime DLL regressions: gnullvm/ucrt exes link
          # libc++/libunwind statically (llvm-mingw import libs removed above)
          for exe in target/x86_64-pc-windows-gnullvm/release/byteshaver.exe target/x86_64-pc-windows-gnullvm/release/byteshaver-gui.exe; do
            if objdump -p "$exe" | grep -qi 'DLL Name: lib\(stdc++\|c++\|unwind\|gcc_s\|winpthread\)'; then
              echo "FATAL: $exe imports a C++/runtime DLL"; objdump -p "$exe" | grep 'DLL Name'; exit 1
            fi
          done
          # binaries are shipped UNPACKED (see the linux step note); the
          # dedicated pack_binaries job produces the optional packed variants
          mkdir -p current_release
          if [ "${{ matrix.cpu_target }}" == "${{ env.BASE_CPU }}" ]; then SUFFIX=""; else SUFFIX="-${{ matrix.cpu_target }}"; fi
          cp target/x86_64-pc-windows-gnullvm/release/byteshaver.exe "current_release/byteshaver-${{ env.VERSION }}${SUFFIX}.exe"
          cp target/x86_64-pc-windows-gnullvm/release/byteshaver-gui.exe "current_release/byteshaver-gui-${{ env.VERSION }}${SUFFIX}.exe"
          ( cd current_release && sha256sum "byteshaver-${{ env.VERSION }}${SUFFIX}.exe" > "byteshaver-${{ env.VERSION }}${SUFFIX}.exe.sha256" && \
            sha256sum "byteshaver-gui-${{ env.VERSION }}${SUFFIX}.exe" > "byteshaver-gui-${{ env.VERSION }}${SUFFIX}.exe.sha256" )
          # license/attribution materials ship with every release
          cp THIRD-PARTY-NOTICES.md docs/dependency-licenses.md current_release/

      - name: Upload binaries to GitHub Release
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          name: Release ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          files: current_release/*

      # Always upload the (unpacked) binaries as workflow artifacts: on tag
      # runs the pack_binaries job consumes them to build the packed variants;
      # on manual workflow_dispatch runs they ARE the deliverable.
      - name: Upload binaries as workflow artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: byteshaver-binaries-${{ matrix.cpu_target }}
          path: current_release/*

  # ---------------------------------------------------------------
  # Optional packed variants (single job, after ALL matrix builds).
  #
  # The release ships the unpacked binaries by default: packing saves
  # ~65-70% size but decompression adds a per-invocation startup toll,
  # and packed exes are a classic AV false-positive trigger. This job
  # produces packed copies *in addition* (suffix `-packed`) using the
  # in-repo zstd packer (tools/packer/, BSD-2 zstd, see
  # THIRD-PARTY-NOTICES.md and docs/zstd-packer-analysis.md).
  # ---------------------------------------------------------------
  pack_binaries:
    needs: build_binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write        # uploads packed artifacts to the GitHub Release (tag runs)
    name: Pack binaries (zpack)
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download all built binaries
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: byteshaver-binaries-*
          merge-multiple: true
          path: to_pack

      - name: Set version from tag
        run: |
          if [[ "$GITHUB_REF_NAME" == v* ]]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV
          else
            echo "VERSION=0.0.0-dispatch" >> $GITHUB_ENV
          fi

      # Build both self-extracting stubs in one alpine run: the ELF stub
      # against musl, the PE stub against the mingw-w64 cross toolchain.
      # libzstd is built decompression-only without legacy decoders and
      # without the duplicated BMI2 paths (92 KB stubs instead of 194 KB);
      # see tools/packer/README.md for the flags' rationale.
      - name: Build zpack stubs
        run: |
          set -euo pipefail
          ZSTD_URL=https://github.com/facebook/zstd/releases/download/v1.5.7/zstd-1.5.7.tar.gz
          ZSTD_SHA256=eb33e51f49a15e023950cd7825ca74a4a2b43db8354825ac24fc1b7ee09e6fa3
          docker run --rm -v "$PWD":/w -w /w alpine:3.22 sh -c '
            set -e
            apk add --no-cache gcc musl-dev make curl mingw-w64-gcc >/dev/null
            curl -sL -o zstd-1.5.7.tar.gz '"$ZSTD_URL"'
            echo '"$ZSTD_SHA256"'  zstd-1.5.7.tar.gz | sha256sum -c -
            tar xzf zstd-1.5.7.tar.gz
            ZFLAGS="-Os -ffunction-sections -fdata-sections -DDYNAMIC_BMI2=0"
            make -C zstd-1.5.7/lib libzstd.a -j4 CFLAGS="$ZFLAGS" ZSTD_LEGACY_SUPPORT=0 >/dev/null
            gcc -Os -static -s -ffunction-sections -fdata-sections -Wl,--gc-sections \
              tools/packer/zpack_stub.c zstd-1.5.7/lib/libzstd.a -Izstd-1.5.7/lib \
              -lpthread -o zpack-stub
            cp -a zstd-1.5.7 zstd-win
            make -C zstd-win/lib clean >/dev/null 2>&1 || true
            make -C zstd-win/lib libzstd.a -j4 CC=x86_64-w64-mingw32-gcc AR=x86_64-w64-mingw32-ar \
              CFLAGS="$ZFLAGS" ZSTD_LEGACY_SUPPORT=0 >/dev/null
            x86_64-w64-mingw32-gcc -Os -static -s -ffunction-sections -fdata-sections \
              -Wl,--gc-sections tools/packer/zpe_stub.c zstd-win/lib/libzstd.a \
              -Izstd-win/lib -lpthread -o zpe-stub.exe
            ls -l zpack-stub zpe-stub.exe
          '

      - name: Pack, verify and checksum
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p current_release
          for f in to_pack/byteshaver*; do
            case "$f" in *.sha256) continue ;; esac
            base="$(basename "$f")"
            # byteshaver-<version>[-cpu][.exe] -> byteshaver-<version>[-cpu]-packed[.exe]
            if [[ "$base" == *.exe ]]; then
              out="${base%.exe}-packed.exe"
              # PE flow: image-layout frames (headers + 4 MiB section chunks)
              python3 tools/packer/zpack.py zpe-stub.exe "$f" "current_release/$out" --pe
            else
              out="${base}-packed"
              # ELF flow: 6 balanced frames (fastest unpack, ~33.5% ratio)
              python3 tools/packer/zpack.py zpack-stub "$f" "current_release/$out" --frames 6
            fi
          done
          # smoke test: only the suffixless linux CLI (x86-64-v3) is
          # guaranteed to run on any runner CPU; cpu-tuned variants may
          # legitimately SIGILL here (e.g. AVX-512 on non-v4 runners)
          if [ -x "current_release/byteshaver-${VERSION}-packed" ]; then
            "current_release/byteshaver-${VERSION}-packed" --version
          fi
          ls -la current_release/
          ( cd current_release && for f in byteshaver*; do
              case "$f" in *.sha256) continue ;; esac
              sha256sum "$f" > "$f.sha256"
            done )

      - name: Upload packed binaries to GitHub Release
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          name: Release ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          files: current_release/*

      - name: Upload packed binaries as workflow artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: byteshaver-binaries-packed
          path: current_release/*

  # ---------------------------------------------------------------
  # Docker build validation (must pass before images are published)
  #
  # Images ship the PREBUILT static-pie binary (no in-container
  # compilation), so this job downloads the x86-64-v3 build artifact,
  # drops it into the docker build context, and validates the exact
  # bytes users get: --help, the dec-heif differential (a broken .heic
  # must fail inside libheif, NOT with the feature-stub message), and
  # an end-to-end decode of a REAL HEIC file (generated in-container
  # via heif-enc from a synthesized Y4M through the x265 plugin).
  # ---------------------------------------------------------------
  validate_docker:
    needs: [build_binaries]
    runs-on: ubuntu-latest
    name: Validate docker images (libheif)
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download prebuilt binary
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: byteshaver-binaries-${{ env.BASE_CPU }}
          path: artifact

      - name: Stage binary into the docker build context
        run: |
          BIN="$(find artifact -maxdepth 1 -name 'byteshaver-*' ! -name 'byteshaver-gui-*' ! -name '*.sha256' | head -1)"
          test -n "$BIN" || { echo "FATAL: no CLI binary in artifact"; exit 1; }
          cp "$BIN" byteshaver
          file byteshaver | grep -q "static-pie" \
            || { echo "FATAL: binary is not static-pie"; exit 1; }
          # THIRD-PARTY-NOTICES.md and docs/dependency-licenses.md are part of
          # the checkout (the .dockerignore re-includes the latter), so only
          # the versioned artifact needs renaming to the `byteshaver` the
          # Dockerfile expects — no license staging (a `cp <file> .` of an
          # already-root file used to fail as 'same file')


      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      # Short-circuit the unified Dockerfile's source-build stage: the
      # prebuilt binary sits in the context, so only the tiny prebuilt
      # stage runs. (The default SOURCE=build reproduces the full pipeline
      # from source — see the Dockerfile header.)
      - name: Build alpine image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: Dockerfile
          tags: byteshaver:validate-alpine
          load: true
          provenance: false
          build-args: |
            SOURCE=prebuilt

      - name: Smoke test alpine image
        run: |
          docker run --rm byteshaver:validate-alpine sh -c 'byteshaver --help >/dev/null && echo "help: ok"'
          # differential: with dec-heif compiled in, a broken .heic must fail
          # inside libheif — NOT with the feature-stub message
          docker run --rm byteshaver:validate-alpine sh -c '
            printf "garbage-not-a-heif" > /tmp/fake.heic
            if byteshaver /tmp/fake.heic webp -o /tmp/o 2>&1 | grep -q "dec-heif feature"; then
              echo "FATAL: dec-heif stub message active — feature not compiled in"; exit 1
            fi
            byteshaver /tmp/fake.heic webp -o /tmp/o 2>&1 | grep -qi libheif \
              && echo "libheif decode path: active"'
          # real HEIC end-to-end: synthesize a Y4M frame, encode a HEIC via
          # heif-enc (x265 plugin), decode with byteshaver to three targets
          docker run --rm byteshaver:validate-alpine sh -c '
            apk add --no-cache libheif-plugins-all libheif-tools x265 >/dev/null
            { printf "YUV4MPEG2 W64 H64 F30:1 It A1:1 C420jpeg\nFRAME\n"; head -c 6144 /dev/zero; } > /tmp/in.y4m
            heif-enc /tmp/in.y4m -o /tmp/real.heic -q 80 >/dev/null
            test -s /tmp/real.heic || { echo "FATAL: fixture not created"; exit 1; }
            byteshaver /tmp/real.heic webp -o /tmp/out 2>&1 | grep -q "Successful:  1" \
              && echo "real HEIC decode -> webp: ok" \
              || { echo "FATAL: real HEIC decode failed"; exit 1; }'


  # ---------------------------------------------------------------
  # crates.io publish (audit M-40): moved out of build_binaries into a
  # late job gated on the artifact build AND docker validation —
  # publishing is irreversible, so it must never run before the release
  # artifacts it corresponds to have been built and tested. Semantics
  # preserved from the old in-matrix step: tag runs only, tolerates
  # "already published" (re-tag after a pipeline fix), verify-builds with
  # the default feature set (dec-heif needs system libde265/dav1d via
  # pkg-config; dynamic system libs are fine — the verify build only
  # proves the crate compiles).
  # ---------------------------------------------------------------
  publish_crate:
    needs: [build_binaries, validate_docker]
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive

      - name: Set version from tag
        run: |
          if [[ "$GITHUB_REF_NAME" == v* ]]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV
          else
            echo "VERSION=0.0.0-dispatch" >> $GITHUB_ENV
          fi

      - name: Set Cargo.toml version
        shell: bash
        run: |
          # Patch BOTH workspace crates (core + gui): the gui crate is
          # versioned in lockstep with byteshaver and the GUI binary displays
          # its own CARGO_PKG_VERSION (header + About panel) — missing
          # gui/Cargo.toml here is what shipped 0.0.0-git GUI releases.
          # Anchored so only the package `version` lines are touched
          # (Cargo.lock has one matching `version = "..."` line per crate).
          sed -i "s/^version = \"0\.0\.0-git\"/version = \"${VERSION}\"/" Cargo.toml gui/Cargo.toml Cargo.lock
          grep -n '^version' Cargo.toml gui/Cargo.toml
          grep -n -A1 '^name = "byteshaver' Cargo.lock

      - name: Install dec-heif verify deps (crates.io publish)
        # note: the Debian/Ubuntu package is libdav1d-dev (NOT dav1d-dev —
        # that's the alpine/apk name used in the Dockerfile)
        run: sudo apt-get install --yes --no-install-recommends pkg-config libde265-dev libdav1d-dev nasm ninja-build

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      # Cargo publish (once!) — publishing an already-published version
      # (e.g. re-tagging a release after a pipeline fix) is a no-op, not an
      # error: crates.io versions are immutable and the API is unreliable
      # from CI (rate limits/UA gating), so we act on cargo's own error
      # instead of pre-checking the API
      - name: Cargo publish crate
        run: |
          set +e
          out="$(cargo publish --allow-dirty 2>&1)"
          rc=$?
          set -e
          echo "$out"
          if [ $rc -ne 0 ]; then
            if echo "$out" | grep -q "already exists"; then
              echo "byteshaver ${VERSION} is already published on crates.io — skipping"
              exit 0
            fi
            exit $rc
          fi
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_API_TOKEN }}
          # host (gnu) build for verification; v3 is safe on all runner CPUs
          RUSTFLAGS: "-C target-cpu=${{ env.BASE_CPU }}"

  publish_docker:
    needs: [validate_docker]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download prebuilt binary
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: byteshaver-binaries-${{ env.BASE_CPU }}
          path: artifact

      - name: Stage binary into the docker build context
        run: |
          BIN="$(find artifact -maxdepth 1 -name 'byteshaver-*' ! -name 'byteshaver-gui-*' ! -name '*.sha256' | head -1)"
          test -n "$BIN" || { echo "FATAL: no CLI binary in artifact"; exit 1; }
          cp "$BIN" byteshaver

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Generate Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.IMAGE_NAME }}
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index

      - name: Build and Push Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: Dockerfile
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SOURCE=prebuilt

      - name: Push README.md to Dockerhub
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          repository: ${{ env.IMAGE_NAME }}
          short-description: 'byteshaver, configurable and efficient batch image converter'
          enable-url-completion: true
