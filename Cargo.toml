[workspace]
members = [".", "gui"]
resolver = "2"

# Vendored, patched jpegxl-src (see tools/jpegxl-src/README.md): builds
# libjxl's AVX3 / AVX3_ZEN4 highway kernels alongside the upstream default
# targets; highway's runtime dispatch keeps older clients on their best path.
[patch.crates-io]
jpegxl-src = { path = "tools/jpegxl-src" }

[package]
name = "byteshaver"
version = "0.0.0-git"
edition = "2024"
authors = ["Duy NG <hi@tduyng.com>", "Daniel Gunzinger <daniel.gunzinger@posteo.de>"]
description = "A configurable and efficient batch image converter written in Rust."
license = "MIT"
documentation = "https://docs.rs/byteshaver"
homepage = "https://github.com/Gunzinger/byteshaver"
repository = "https://github.com/Gunzinger/byteshaver"
keywords = ["CLI", "image", "conversion", "webp", "avif"]
readme = "README.md"
categories = [
    "command-line-utilities",
    "multimedia::images",
    "multimedia::encoding",
]
include = [
    "README.md",
    "LICENSE",
    "Cargo.toml",
    "/src/**/*.rs",
    "build.rs"
]
default-run = "byteshaver"

[features]
default = ["opt-oxipng", "exif", "jxl", "anim-webp", "anim-apng", "logs"]
# Optional oxipng-based PNG re-optimization target (kept optional so
# `--no-default-features` builds stay slim); intentionally excludes the
# `parallel` and `binary` features of oxipng to avoid thread-pool
# oversubscription and duplicate CLI dependencies.
opt-oxipng = ["dep:oxipng"]
# EXIF/metadata handling (kamadak-exif); without it, all EXIF is stripped
exif = ["dep:kamadak-exif"]
# Optional HEIC/HEIF/AVIF input decoding via libheif (opt-in because it needs
# the native libheif + codec libraries, e.g. libde265/libaom, at build time);
# without it, HEIC/HEIF/AVIF inputs report a per-file error and the batch
# continues. Kept out of `default` so musl/windows release binaries stay
# self-contained (see README + docs/plans/01-heic-heif-decoding.md).
dec-heif = ["dep:libheif-rs"]
# JPEG XL source decoding (jxl-oxide) and target encoding (in-tree FFI
# bindings to libjxl, built by jpegxl-src). Requires cmake + a C++
# compiler + nasm at build time. Decode-only without cmake: the encode
# path needs the vendored libjxl build.
jxl = ["dep:jxl-oxide", "dep:jpegxl-src", "dep:moxcms"]
# Animated WebP target (and decode-independent still targets) via webp-animation
anim-webp = ["dep:webp-animation"]
# Animated PNG (APNG) target via the png crate (already a direct dependency)
anim-apng = []
# JSON-lines event logging (`JsonlReporter`, `--json-log`); serde itself is a
# non-optional dependency (config types are always serializable)
logs = ["dep:serde_json"]

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
glob = "0.3.4"
ctrlc = "3.5.2"
#image = {version = "0.25.8", features = ["avif-native"] } # problematic on windows
image = {version = "0.25.10"}
rayon = "1.12.0"
webp = "0.3.1"
ravif_new = { package="ravif", version="0.13.0" }
rgb = "0.8.53"
indicatif = {version = "0.18.6", features = ["rayon"]}
mozjpeg = "0.10.13"
jpeg-decoder = "0.3.2"
humansize = "2.1.3"
oxipng = { version = "10.2", optional = true, default-features = false, features = ["zopfli"] }
png = "0.18.1"
kamadak-exif = { version = "0.6", optional = true }
# native HEIC/HEIF/AVIF input decoder (libheif bindings); `v1_19` is the
# minimum-version gate (not a pin — newer libs like alpine's 1.23 work) so
# debian trixie's libheif 1.19.8 satisfies it; all APIs used for decoding are
# older than 1.19. `default-features = false` avoids the crate's `image`
# integration feature (decoding is wired manually)
libheif-rs = { version = "3", optional = true, default-features = false, features = ["v1_19"] }
jxl-oxide = { version = "0.12", default-features = false, features = ["rayon", "moxcms", "image"], optional = true }
moxcms = { version = "0.9", optional = true }
jpegxl-src = { version = "0.12", optional = true }
# `static` forces libwebp-sys2 to always build its bundled libwebp instead of
# linking a system libwebp found via pkg-config — required for static musl
# builds and reproducible release artifacts (a system libwebp pulled in
# transitively, e.g. by libheif-dev, would otherwise break static linking)
webp-animation = { version = "0.10", optional = true, features = ["static"] }
# headless job API: config/result serialization (always on) and the JSON-lines
# reporter (`logs` feature)
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", optional = true }

[build-dependencies]
cargo_metadata = "0.23.1"
# build-deps cannot be optional; the build script only calls it when the
# `jxl` feature is active (detected via the CARGO_FEATURE_JXL env var).
jpegxl-src = "0.12"

[profile.dev]
opt-level = 2
debug = "full"
lto = false
strip = false
codegen-units = 16

[profile.release]
opt-level = 3 # "z" can significantly reduce binary size
panic = "abort" # "unwind" for debugging
debug = "none"
debug-assertions = false
overflow-checks = false
incremental = false
rpath = false
lto = true
strip = true
codegen-units = 1 # 16 for debugging/fast build time; 1 for release builds (lowers binary size)

[profile.dev.package."*"]
opt-level = 2

[profile.release.package."*"]
opt-level = 3
codegen-units = 1
debug-assertions = false
overflow-checks = false
strip = true

[badges]
maintenance = { status = "actively-developed" }
