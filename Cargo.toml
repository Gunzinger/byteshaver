[package]
name = "byteshaver"
version = "0.0.0-git"
edition = "2024"
authors = ["Duy NG <hi@tduyng.com>", "Daniel Gunzinger <daniel.gunzinger@posteo.de>"]
description = "A configurable and efficient batch image converter written in Rust."
license = "MIT"
documentation = "https://docs.rs/byteshaver"
homepage = "https://github.com/Gunzinger/byteshaver"
repository = "https://github.com/Gunzinger/byteshaver"
keywords = ["CLI", "image", "conversion", "webp", "avif"]
readme = "README.md"
categories = [
    "command-line-utilities",
    "multimedia::images",
    "multimedia::encoding",
]
include = [
    "README.md",
    "LICENSE",
    "Cargo.toml",
    "/src/**/*.rs",
    "build.rs"
]
default-run = "byteshaver"

[features]
default = ["opt-oxipng"]
# Optional oxipng-based PNG re-optimization target (kept optional so
# `--no-default-features` builds stay slim); intentionally excludes the
# `parallel` and `binary` features of oxipng to avoid thread-pool
# oversubscription and duplicate CLI dependencies.
opt-oxipng = ["dep:oxipng"]

[dependencies]
clap = { version = "4.6.7", features = ["derive"] } # 4.5.41 changes parser ordering; makes command ugly...
glob = "0.3.4"
ctrlc = "3.5.2"
#image = {version = "0.25.8", features = ["avif-native"] } # problematic on windows
image = {version = "0.25.10"}
rayon = "1.12.0"
webp = "0.3.1"
ravif_new = { package="ravif", version="0.13.0" }
rgb = "0.8.53"
indicatif = {version = "0.18.6", features = ["rayon"]}
mozjpeg = "0.10.13"
jpeg-decoder = "0.3.2"
humansize = "2.1.3"
oxipng = { version = "10.2", optional = true, default-features = false, features = ["zopfli"] }

[dev-dependencies]
png = "0.18"

[build-dependencies]
cargo_metadata = "0.23.1"

[profile.dev]
opt-level = 2
debug = "full"
lto = false
strip = false
codegen-units = 16

[profile.release]
opt-level = 3 # "z" can significantly reduce binary size
panic = "abort" # "unwind" for debugging
debug = "none"
debug-assertions = false
overflow-checks = false
incremental = false
rpath = false
lto = true
strip = true
codegen-units = 1 # 16 for debugging/fast build time; 1 for release builds (lowers binary size)

[profile.dev.package."*"]
opt-level = 2

[profile.release.package."*"]
opt-level = 3
codegen-units = 1
debug-assertions = false
overflow-checks = false
strip = true

[badges]
maintenance = { status = "actively-developed" }
