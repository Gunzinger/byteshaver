[package]
name = "byteshaver-gui"
version = "0.0.0-git"
edition = "2024"
authors = ["Duy NG <hi@tduyng.com>", "Daniel Gunzinger <daniel.gunzinger@posteo.de>"]
description = "Desktop GUI (egui/eframe) for the byteshaver image converter."
license = "MIT"
documentation = "https://docs.rs/byteshaver"
homepage = "https://github.com/Gunzinger/byteshaver"
repository = "https://github.com/Gunzinger/byteshaver"
keywords = ["GUI", "image", "conversion", "webp", "avif"]
categories = [
    "gui",
    "multimedia::images",
    "multimedia::encoding",
]

# Versioned in lockstep with the core `byteshaver` crate (displayed in the
# About panel; the gui crate has no independent release version).

[features]
default = ["wayland", "x11", "heif"]
# windowing backend passthrough: the release build is a dynamically
# linked glibc binary with BOTH backends (see the workflow's linux GUI
# step): winit loads libwayland-client.so.0 / libX11.so.6 via dlopen at
# runtime (wayland-sys / x11-dl), which cannot work from a fully static
# binary — and accesskit_winit's default features enable winit/wayland
# regardless, so a "wayland-free" build is not expressible anyway.
wayland = ["eframe/wayland"]
x11 = ["eframe/x11"]
# HEIC/HEIF/AVIF input passthrough: default-on everywhere, including
# the release build — libheif-sys's embedded-libheif compiles the
# vendored libheif statically with the decode-only libde265/dav1d
# plugins baked in (see tools/libheif-static/), adding no runtime
# library dependency. The feature exists so toolchain-less builds
# (and `cargo clippy --workspace`) can opt out of the vendored build.
heif = ["byteshaver/dec-heif"]

[dependencies]
# egui/eframe 0.36: `App::update(ctx, frame)` split into `logic`/`ui`,
# panels/labels reworked vs 0.32; drag-and-drop still surfaces
# `RawInput::dropped_files`/`hovered_files` (`Vec<DroppedFile>` with plain
# `path: Option<PathBuf>`).
# `default-features = false` + explicit base features so the wayland/x11
# backends are opt-in via the crate features above.
eframe = { version = "0.37", default-features = false, features = [
    "accesskit",
    "default_fonts",
    "glow",
] }
egui = "0.37"
# table widget (sortable headers, resizable columns, row virtualization)
# — pinned to the same 0.36 line as egui/eframe above
egui_extras = "0.37"
# thumbnail decode + header-only dimension reads (plan 11 §6): same
# version line as the core's `image` dependency, no extra features
image = "0.25"
# native file dialogs; on Linux the default `xdg-portal` backend compiles
# without GTK dev packages (needs the xdg-desktop-portal service at runtime)
rfd = "0.17"
# the conversion core; the explicit feature list mirrors the core's
# defaults minus dec-heif (kept opt-in via the `heif` feature above):
# the options editors and the EXIF policy injection reference their
# types/fields unconditionally (see gui/README.md)
byteshaver = { path = "..", default-features = false, features = [
    "opt-oxipng",
    "exif",
    "jxl",
    "anim-webp",
    "anim-apng",
    "logs",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "7"

# the CLI parity tests build CliArgs exactly like the CLI binary does
clap = "4"

# DSSIM (multi-scale SSIM) quality metric, plan 10 §phase 2: pure Rust,
# internally downsamples (large-image friendly), score 0.0 = identical.
# The `rgb` types are part of dssim's public API (`create_image_rgba`
# takes `&[RGBA<u8>]`) — same 0.8 line the core already uses.
dssim = "3"
rgb = "0.8"
