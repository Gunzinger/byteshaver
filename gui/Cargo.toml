[package]
name = "byteshaver-gui"
version = "0.0.0-git"
edition = "2024"
authors = ["Duy NG <hi@tduyng.com>", "Daniel Gunzinger <daniel.gunzinger@posteo.de>"]
description = "Desktop GUI (egui/eframe) for the byteshaver image converter."
license = "MIT"
documentation = "https://docs.rs/byteshaver"
homepage = "https://github.com/Gunzinger/byteshaver"
repository = "https://github.com/Gunzinger/byteshaver"
keywords = ["GUI", "image", "conversion", "webp", "avif"]
categories = [
    "gui",
    "multimedia::images",
    "multimedia::encoding",
]

# Versioned in lockstep with the core `byteshaver` crate (displayed in the
# About panel; the gui crate has no independent release version).

# lib + bin split (plan 17 §6.1): the application modules live in the
# `byteshaver_gui` library so the binary, tests and the feature-gated
# `bh-gui-capture` capture binary share one implementation.
[lib]
name = "byteshaver_gui"
path = "src/lib.rs"

[[bin]]
name = "byteshaver-gui"
path = "src/main.rs"

[features]
default = ["wayland", "x11"]
# windowing backend passthrough: the static musl GUI build uses
# `--no-default-features --features x11` (no wayland system libraries),
# desktop builds use the default (wayland + x11)
wayland = ["eframe/wayland"]
x11 = ["eframe/x11"]

[dependencies]
# egui/eframe 0.36: `App::update(ctx, frame)` split into `logic`/`ui`,
# panels/labels reworked vs 0.32; drag-and-drop still surfaces
# `RawInput::dropped_files`/`hovered_files` (`Vec<DroppedFile>` with plain
# `path: Option<PathBuf>`).
# `default-features = false` + explicit base features so the wayland/x11
# backends are opt-in via the crate features above.
eframe = { version = "0.36", default-features = false, features = [
    "accesskit",
    "default_fonts",
    "glow",
] }
egui = "0.36"
# table widget (sortable headers, resizable columns, row virtualization)
# — pinned to the same 0.36 line as egui/eframe above
egui_extras = "0.36"
# thumbnail decode + header-only dimension reads (plan 11 §6): same
# version line as the core's `image` dependency, no extra features
image = "0.25"
# native file dialogs; on Linux the default `xdg-portal` backend compiles
# without GTK dev packages (needs the xdg-desktop-portal service at runtime)
rfd = "0.17"
# the conversion core; must keep its default features (opt-oxipng, exif,
# jxl, anim-webp, anim-apng): the options editors and the EXIF policy
# injection reference their types/fields unconditionally (see gui/README.md)
byteshaver = { path = ".." }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "7"

# the CLI parity tests build CliArgs exactly like the CLI binary does
clap = "4"

# DSSIM (multi-scale SSIM) quality metric, plan 10 §phase 2: pure Rust,
# internally downsamples (large-image friendly), score 0.0 = identical.
# The `rgb` types are part of dssim's public API (`create_image_rgba`
# takes `&[RGBA<u8>]`) — same 0.8 line the core already uses.
dssim = "3"
rgb = "0.8"

[dev-dependencies]
egui_kittest = { version = "0.36", features = ["eframe", "wgpu"] }
